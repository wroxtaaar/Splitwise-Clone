name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

env:
  KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test

      - name: Prepare web assets
        run: npm run build:mobile

      - name: Generate Android project
        run: npx cap add android

      - name: Generate launcher icons
        run: npx @capacitor/assets generate --android

      - name: Add Firebase (push notifications)
        run: |
          if [ ! -f firebase/google-services.json ]; then
            echo "::error::firebase/google-services.json is missing. See 'Push notifications' in the README."
            exit 1
          fi
          cp firebase/google-services.json android/app/google-services.json
          sed -i 's#<application#<uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <application#' android/app/src/main/AndroidManifest.xml
          grep -q POST_NOTIFICATIONS android/app/src/main/AndroidManifest.xml

      - name: Add the self-updater (native plugin + permission)
        run: |
          pkgdir=android/app/src/main/java/com/wroxtaaar/splits
          mkdir -p "$pkgdir"
          cp native/ApkUpdater.java native/MainActivity.java "$pkgdir/"
          sed -i 's#<application#<uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES" />\n    <application#' android/app/src/main/AndroidManifest.xml
          grep -q REQUEST_INSTALL_PACKAGES android/app/src/main/AndroidManifest.xml

      - name: Sync web app into Android project
        run: npx cap sync android

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Sign with the permanent key (when the keystore secret exists)
        if: env.KS_B64 != ''
        run: |
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/expense.p12"
          cat >> android/app/build.gradle <<EOF

          android {
              defaultConfig {
                  versionCode ${{ github.run_number }}
                  versionName "1.${{ github.run_number }}"
              }
              signingConfigs {
                  release {
                      storeFile file("$RUNNER_TEMP/expense.p12")
                      storePassword "expense-ks"
                      keyAlias "expense"
                      keyPassword "expense-ks"
                  }
              }
              buildTypes {
                  release { signingConfig signingConfigs.release }
              }
          }
          EOF

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          if [ -n "$KS_B64" ]; then TASK=assembleRelease; else TASK=assembleDebug; fi
          for attempt in 1 2 3; do
            echo "Gradle build attempt $attempt/3 ($TASK)"
            if ./gradlew $TASK --no-daemon --max-workers=2; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Build failed; waiting before retrying transient dependency downloads..."
              sleep $((attempt * 30))
            fi
          done
          exit 1

      - name: Collect APK
        run: |
          mkdir -p out
          cp "$(ls android/app/build/outputs/apk/release/*.apk android/app/build/outputs/apk/debug/*.apk 2>/dev/null | head -1)" out/Expense.apk

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: Expense-debug-apk
          path: out/Expense.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish update (GitHub release "latest")
        if: env.KS_B64 != '' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          N=${{ github.run_number }}
          sha=$(sha256sum out/Expense.apk | cut -d' ' -f1)
          cp out/Expense.apk "out/Expense-$N.apk"
          echo "{\"versionCode\": $N, \"sha256\": \"$sha\", \"apk\": \"Expense-$N.apk\"}" > out/version.json
          gh release view latest >/dev/null 2>&1 || gh release create latest --title "Latest build" --notes "Auto-updated by CI. The Expense app downloads this." --latest
          # Each build gets its own file name, so a cached or half-updated download can never be mixed with another build's checksum.
          gh release upload latest "out/Expense-$N.apk" --clobber
          gh release upload latest out/Expense.apk --clobber   # older installed apps still use this fixed name
          gh release upload latest out/version.json --clobber
          # keep only the newest few numbered builds
          gh release view latest --json assets --jq '.assets[].name' | grep -E '^Expense-[0-9]+\.apk$' | sort -t- -k2 -n | head -n -3 | xargs -r -I{} gh release delete-asset latest {} -y
